[project]
name = "openocr-worker"
version = "0.1.0"
description = "Universal Document Extraction Platform Async Pipeline Worker"
requires-python = ">=3.11"
dependencies = [
    "arq>=0.25.0",
    "redis>=5.0.4",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "boto3>=1.34.0",
    "pillow>=13.0.0",
    "openocr-providers",
]

[tool.uv.sources]
openocr-providers = { workspace = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["worker*"]
