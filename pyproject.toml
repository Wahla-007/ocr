[project]
name = "openocr-platform"
version = "0.1.0"
description = "Universal Document Extraction Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "providers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]
ignore = ["B008", "E501", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"extract_cli.py" = ["E402"]


[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["apps/api/tests", "apps/worker/tests", "tests"]
pythonpath = ["apps/api", "apps/worker", "."]
asyncio_mode = "auto"
