[project]
name = "openocr-providers"
version = "0.1.0"
description = "Vendor-isolated parse and LLM provider interfaces and implementations"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["providers"]
package-dir = {"providers" = "."}
