version: '3.8'

# ==============================================================================
# OpenOCR Self-Hosted Standalone Architecture
# Local Vision Models (Ollama) | Air-Gapped Capable | Zero External Cloud Dependencies
# ==============================================================================

services:
  # 1. Standalone Core Engine (FastAPI + pypdfium2 + Ollama Vision)
  openocr-core:
    build:
      context: .
      dockerfile: Dockerfile.selfhosted
    container_name: openocr_selfhosted_core
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - ENV=production
      - OPENOCR_SELF_HOSTED=true
      - PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - OLLAMA_MODEL=qwen2.5vl
      - LOCAL_STORAGE_DIR=/app/data
      - MAX_PAGE_LIMIT=500
      - LOG_LEVEL=info
    volumes:
      - ./data/storage:/app/data
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
        reservations:
          cpus: '1.0'
          memory: 512M

  # 2. Local Air-Gapped Vision Model Runner (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: openocr_selfhosted_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  # 3. Minimalist Research Web UI (Next.js)
  openocr-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: openocr_selfhosted_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_SELF_HOSTED=true
    depends_on:
      openocr-core:
        condition: service_healthy

volumes:
  openocr_data:
  ollama_models:

