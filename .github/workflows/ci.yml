name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python-lint-test:
    name: Python Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: openocr_secure_pass
          POSTGRES_DB: openocr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: |
          uv python install 3.11
          uv venv --python 3.11 .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          uv pip install --python .venv -e providers/
          uv pip install --python .venv -e apps/api/
          uv pip install --python .venv -e apps/worker/
          uv pip install --python .venv "psycopg[binary]" ruff pytest pytest-asyncio aiosqlite

      - name: Run Ruff Lint
        run: ruff check .

      - name: Run Database Migrations
        env:
          POSTGRES_USER: postgres
          PGUSER: postgres
          DATABASE_URL_SYNC: postgresql+psycopg2://postgres:openocr_secure_pass@localhost:5432/openocr
        run: |
          for i in {1..30}; do
            python -c "import socket; s = socket.socket(); s.connect(('127.0.0.1', 5432)); s.close()" 2>/dev/null && break
            echo "Waiting for postgres on port 5432..."
            sleep 1
          done
          cd apps/api
          alembic upgrade head

      - name: Run API Tests
        env:
          POSTGRES_USER: postgres
          PGUSER: postgres
          DATABASE_URL: postgresql+asyncpg://postgres:openocr_secure_pass@localhost:5432/openocr
          DATABASE_URL_SYNC: postgresql+psycopg2://postgres:openocr_secure_pass@localhost:5432/openocr
          REDIS_URL: redis://localhost:6379/0
        run: |
          for i in {1..30}; do
            python -c "import socket; s = socket.socket(); s.connect(('127.0.0.1', 6379)); s.close()" 2>/dev/null && break
            echo "Waiting for redis on port 6379..."
            sleep 1
          done
          pytest apps/api/tests -v --tb=short 2>&1 | tee api_test.log || {
            echo "## API Tests Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 api_test.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Run Worker Tests
        env:
          POSTGRES_USER: postgres
          PGUSER: postgres
          DATABASE_URL: postgresql+asyncpg://postgres:openocr_secure_pass@localhost:5432/openocr
          REDIS_URL: redis://localhost:6379/0
        run: pytest apps/worker/tests -v --tb=short

  web-lint-build:
    name: Web App Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Type check
        working-directory: apps/web
        run: npm run type-check

      - name: Build
        working-directory: apps/web
        run: npm run build
